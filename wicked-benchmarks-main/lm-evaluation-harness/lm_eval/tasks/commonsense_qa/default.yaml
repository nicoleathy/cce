task: commonsense_qa
dataset_path: tau/commonsense_qa
training_split: train
validation_split: validation
output_type: multiple_choice
process_docs: !function utils.preprocessing
doc_to_text: "Question: {{ question.strip() }}\nAnswer:"
doc_to_target: "{{gold}}"
doc_to_choice: "{{choices.text}}"
process_results: !function utils.cce_process_results
metric_list:
  - metric: acc
    aggregation: !function utils.nanmean
    higher_is_better: true
  - metric: acc_gold_removed
    aggregation: !function utils.nanmean
    higher_is_better: true
  - metric: acc_distractor_removed
    aggregation: !function utils.nanmean
    higher_is_better: true
  - metric: nota_false_positive
    aggregation: !function utils.nanmean
    higher_is_better: false
metadata:
  version: 2.0


